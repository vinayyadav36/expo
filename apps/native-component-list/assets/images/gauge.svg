<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><style>.tick{stroke:#555;stroke-width:var(--tick-width, 1)}.marker{display:var(--marker, none);fill:#d33333}</style><rect width="90" height="90" x="5" y="5" fill="#f4f4f4" stroke="#888" stroke-width="var(--frame-width, 2)" rx="var(--corner-radius, 8)"/><g opacity="var(--track-opacity, 1)" transform="rotate(135 50 55)"><circle cx="50" cy="55" r="32" fill="none" stroke="#ddd" stroke-dasharray="151 201" stroke-linecap="round" stroke-width="var(--track-width, 6)"/><circle cx="50" cy="55" r="32" fill="none" stroke="#4a7" stroke-dasharray="var(--progress 50) 201" stroke-linecap="round" stroke-width="var(--track-width, 6)"/></g><line x1="50" x2="50" y1="19" y2="23" class="tick"/><line x1="24.5" x2="27.5" y1="29.5" y2="32.5" class="tick"/><line x1="75.5" x2="72.5" y1="29.5" y2="32.5" class="tick"/><polygon points="50 10 46 16 54 16" class="marker"/><g transform="rotate(var(--angle, 0) 50 55)"><line x1="50" x2="50" y1="55" y2="30" stroke="#c33" stroke-linecap="round" stroke-width="var(--needle-width, 2)"/></g><circle cx="50" cy="55" r="var(--hub-radius, 4)" fill="#333"/></svg>